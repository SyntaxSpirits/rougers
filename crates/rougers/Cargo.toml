[package]
name = "rougers"
description = "Fast ROUGE metrics with scores identical to Google's rouge-score"
readme = "../../README.md"
documentation = "https://docs.rs/rougers"
keywords = ["rouge", "nlp", "summarization", "evaluation", "metrics"]
categories = ["text-processing", "science"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
icu_casemap = "=2.3.0"
icu_properties = "=2.3.0"
# The tokenizer profiles must not change: pin the Unicode data as well.
icu_casemap_data = "=2.3.0"
icu_properties_data = "=2.3.0"
rustc-hash = "2.1"
unicode-normalization = "=0.1.25"
unicode-segmentation = "=1.13.3"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "scorer"
harness = false
