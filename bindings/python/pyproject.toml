[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "rouge-score-rs"
description = "Fast ROUGE scoring for Python: an independent Rust implementation compatible with rouge-score"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Alex Kholodniak", email = "alexandrkholodniak@gmail.com" }]
requires-python = ">=3.9"
keywords = ["rouge", "nlp", "summarization", "evaluation", "metrics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dynamic = ["version"]

[project.optional-dependencies]
aggregate = ["numpy"]
sentences = ["nltk"]

[project.urls]
Repository = "https://github.com/SyntaxSpirits/rougers"
Issues = "https://github.com/SyntaxSpirits/rougers/issues"

[dependency-groups]
dev = ["pytest", "hypothesis", "rouge-score", "nltk", "numpy"]

[tool.maturin]
python-source = "python"
module-name = "rouge_score_rs._rougers"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["rouge_score_rs"]
